<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2WD Chassis Controller</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --accent: #0f3460;
            --highlight: #e94560;
            --text: #ffffff;
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevents pull-to-refresh on mobile */
        }
        header {
            width: 100%; padding: 15px 0;
            background-color: var(--panel-bg);
            text-align: center;
            font-size: 1.2rem; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex; justify-content: space-around; align-items: center;
        }
        button {
            padding: 10px 20px; border: none; border-radius: 8px;
            background-color: var(--accent); color: white;
            font-weight: bold; font-size: 1rem;
            cursor: pointer; transition: 0.2s;
        }
        button:active { background-color: var(--highlight); }
        #connectBtn { background-color: #27ae60; }
        
        .controls-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box;
            flex-grow: 1;
        }

        /* Joystick Area */
        .joystick-area {
            position: relative; width: 250px; height: 250px;
            background-color: var(--panel-bg); border-radius: 50%;
            border: 4px solid var(--accent);
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .joystick-knob {
            position: absolute; width: 70px; height: 70px;
            background-color: var(--highlight); border-radius: 50%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            pointer-events: none; /* Let parent handle touch */
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
        }

        #status {
            margin-top: 30px; font-size: 1rem; color: #aaa;
            font-family: monospace;
            background: var(--panel-bg);
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <span>Chassis V1</span>
        <button id="connectBtn">Connect BLE</button>
    </header>

    <div class="controls-container">
        
        <div class="joystick-area" id="joystickZone">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        
        <div id="status">Status: Disconnected<br>X: 0 | Y: 0</div>

    </div>

    <script>
        // BLE Settings matching ESP32 firmware
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let bluetoothDevice;
        let rxCharacteristic;

        // State Variables
        let joyX = 0; // -100 to 100
        let joyY = 0; // -100 to 100 (Negative is backward, Positive is forward)
        let transmitInterval = null;

        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        // ==== BLE Connection Logic ====
        connectBtn.addEventListener('click', async () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
                return;
            }
            try {
                statusDiv.innerHTML = "Requesting Bluetooth Device...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'ESP32-Chassis' }],
                    optionalServices: [SERVICE_UUID]
                });
                
                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
                
                statusDiv.innerHTML = "Connecting to GATT Server...";
                const server = await bluetoothDevice.gatt.connect();
                
                statusDiv.innerHTML = "Getting Service...";
                const service = await server.getPrimaryService(SERVICE_UUID);
                
                statusDiv.innerHTML = "Getting Characteristic...";
                rxCharacteristic = await service.getCharacteristic(RX_UUID);
                
                statusDiv.innerHTML = "Connected to Robot!";
                connectBtn.innerText = "Disconnect";
                connectBtn.style.backgroundColor = "#e74c3c";
                
                // Start transmitting state to ESP32 at 20Hz (every 50ms)
                if(transmitInterval) clearInterval(transmitInterval);
                transmitInterval = setInterval(sendDataToRobot, 50);

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "Connection Failed: " + error;
            }
        });

        function onDisconnected() {
            statusDiv.innerHTML = "Status: Disconnected<br>X: 0 | Y: 0";
            connectBtn.innerText = "Connect BLE";
            connectBtn.style.backgroundColor = "#27ae60";
            if(transmitInterval) clearInterval(transmitInterval);
        }

        async function sendDataToRobot() {
            if (!rxCharacteristic) return;
            // Simplified Format: "Y,X\n" 
            const dataString = `${joyY},${joyX}\n`;
            
            // Update UI status text
            statusDiv.innerHTML = `Connected!<br>Y: ${joyY} | X: ${joyX}`;
            
            const encoder = new TextEncoder();
            try {
                await rxCharacteristic.writeValueWithoutResponse(encoder.encode(dataString));
            } catch (e) {
                console.error("Send error", e);
            }
        }

        // ==== Custom Joystick Logic ====
        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');
        
        let isDragging = false;
        const maxRadius = 125; // Half of 250px area

        function handlePointerDown(e) {
            isDragging = true;
            joystickKnob.style.transition = 'none'; // Snap instantly to finger
            handlePointerMove(e);
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            e.preventDefault(); // Prevent scrolling

            // Support touch and mouse
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Distance from center
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            
            // Limit to circle
            const distance = Math.sqrt(dx*dx + dy*dy);
            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            // Move the knob (translate from standard 50/50 centered position)
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;

            // Calculate output -100 to 100
            joyX = Math.round((dx / maxRadius) * 100);
            joyY = Math.round(-(dy / maxRadius) * 100); // Y is inverted in screen coordinates
        }

        function handlePointerUp() {
            isDragging = false;
            // Snap back to center
            joystickKnob.style.transition = 'transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            joystickKnob.style.transform = 'translate(-50%, -50%)';
            joyX = 0;
            joyY = 0;
            
            if(bluetoothDevice && bluetoothDevice.gatt.connected) sendDataToRobot();
        }

        // Attach listeners (Mouse + Touch)
        joystickZone.addEventListener('mousedown', handlePointerDown);
        joystickZone.addEventListener('touchstart', handlePointerDown, {passive: false});
        
        document.addEventListener('mousemove', handlePointerMove);
        document.addEventListener('touchmove', handlePointerMove, {passive: false});
        
        document.addEventListener('mouseup', handlePointerUp);
        document.addEventListener('touchend', handlePointerUp);

    </script>
</body>
</html>
